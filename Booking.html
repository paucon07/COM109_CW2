            <div style="max-width:700px; margin:auto;">

                <div style="display:flex; gap:1.5rem; margin-bottom:1rem;">
                    <div style="flex:1;">
                        <label>Forename</label><br>
                        <input type="text" name="forename" style="width:100%;">
                    </div>

                    
                    <div style="flex:1;">
                        <label>Surname</label><br>
                        <input type="text" name="surname" style="width:100%;">
                    </div>
                </div>

                <div style="display:flex; gap:1.5rem; margin-bottom:1rem;">
                    
                    <div style="flex:1;">
                        <label>Phone Number</label><br>
                        <input type="text" name="phone" style="width:100%;">
                    </div>

                    <div style="flex:1;">
                        <label>Email</label><br>
                        <input type="text" name="email" style="width:100%;">
                    </div>
                </div>

                <div style="display:flex; gap:1.5rem;">
                    <div style="flex:1;">
                        <label>Guests</label><br>
                        <input type="number" name="guests" min="1" style="width:100%;">
                    </div>

                    <div style="flex:1;">
                        <label>Accessibility</label><br>
                        <textarea style="width:100%;"></textarea>
                    </div>
                </div>

            </div>
  
            <br>
            <div style="text-align:center; margin-top:1.5rem;">
            <button onclick="validateStep1()">Next →</button>
            </div>
        </section>

            <div style="max-width:700px; margin:auto;">

                <!-- Dates -->
                <div style="display:flex; gap:1.5rem; margin-bottom:1.5rem;">
                    <div style="flex:1;">
                        <label>Start Date</label><br>
                        <input type="date" name="start-date" min="" style="width:100%;">
                    </div>

                    <div style="flex:1;">
                        <label>End Date</label><br>
                        <input type="date" name="end-date" style="width:100%;">
                    </div>
                </div>

                <!-- Room -->
                <div style="margin-bottom:1.5rem;">
                    <label>Room</label><br>
                    <select style="width:100%;">
                        <option>Single</option>
                        <option>Double</option>
                        <option>Suite</option>
                    </select>
                    <br><br>
                    <button>View Rooms</button>
                </div>

                <!-- Deals -->
                <div>
                    <label>Deals</label><br>
                    <select style="width:100%;">
                        <option>No Deal</option>
                        <option>Discount</option>
                    </select>
                    <br><br>
                    <button>View Deals</button>
                </div>

            </div>
            <br>
            <div style="text-align:center; margin-top:1.5rem;">
            <button onclick="validateStep2()">Next →</button>
            </div>


            <div style="text-align:center; margin-top:1.5rem;">
            <button onclick="prevStep()">← Back</button>
            </div>

        <section id="step3" class="section hidden" style="padding: 2rem 1rem;">

            <div style="max-width:700px; margin:auto;">

                <!-- Card Number -->
                <div style="margin-bottom:1.5rem;">
                    <label>Card Number</label><br>
                    <input type="text" name="card-number" maxlength="19" style="width:100%;">
                </div>

                <!-- Name + CVC -->
                <div style="display:flex; gap:1.5rem;">
                    <div style="flex:2;">
                        <label>Name on Card</label><br>
                        <input type="text" name="card-name" style="width:100%;">
                    </div>

                    <div style="flex:1;">
                        <label>CVC</label><br>
                        <input type="text" name="cvc" maxlength="3" style="width:100%;">
                    </div>
                </div>

            </div>

            </div>
            <div style="text-align:center; margin-top:1.5rem;">
            <button onclick="validateStep3()">Complete Booking</button>
